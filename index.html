<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#182620">
  <title>人大校园漫游 · 小吉黑客松</title>
  <link rel="stylesheet" href="./src/style.css">
  <script defer src="./vendor/phaser-arcade-physics.min.js"></script>
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <main class="stage" aria-label="人大校园漫游">
    <div id="game"></div>
    <header class="hud">
      <div class="place">
        <h1>人大校园漫游</h1>
        <div id="location" class="location"><span class="pin" aria-hidden="true"></span><span>东门</span></div>
      </div>
      <div class="hud-actions">
        <button type="button" id="map-open">校园全图 <kbd>M</kbd></button>
        <button type="button" id="fullscreen" hidden>全屏</button>
      </div>
    </header>
    <div id="prompt" class="interact-prompt" hidden>
      <span class="bubble" aria-hidden="true">!</span><kbd aria-label="按 E 互动">E</kbd>
    </div>
    <div id="notice" class="notice" role="status" hidden>迎新海报已张贴</div>

    <div class="minimap">
      <button type="button" id="minimap-open" aria-label="打开校园全图">
        <canvas id="minimap" width="400" height="235"></canvas>
        <span aria-hidden="true">↑ 北</span>
      </button>
    </div>

    <footer class="control-bar">
      <div class="key-help"><kbd>WASD</kbd> / <kbd>方向键</kbd> 移动 <kbd>E</kbd> 互动</div>
      <button type="button" id="reset">重新开始</button>
    </footer>
    <div class="touch-controls" aria-label="触屏游戏操作">
      <div class="dpad">
        <button type="button" data-move="up" aria-label="向上">↑</button>
        <button type="button" data-move="left" aria-label="向左">←</button>
        <button type="button" data-move="down" aria-label="向下">↓</button>
        <button type="button" data-move="right" aria-label="向右">→</button>
      </div>
      <button type="button" id="touch-interact">互动</button>
    </div>
  </main>

  <dialog class="task-dialog" id="dialog" aria-labelledby="task-title" hidden>
    <div class="panel-heading">
      <h2 id="task-title">一张迎新海报</h2>
      <span id="progress" class="progress" aria-label="任务进度">0 / 3</span>
      <button class="close-button" id="dialog-close" type="button" aria-label="关闭任务栏">×</button>
    </div>
    <div class="task-content">
      <div>
        <h3 id="dialog-title"></h3>
        <p id="dialog-text"></p>
        <button class="dialog-action" id="dialog-action" type="button"><kbd>E</kbd> <span></span></button>
      </div>
      <div class="task-steps">
        <p id="objective"></p>
        <ol id="steps">
          <li>东门 · 迎新点</li>
          <li>广场 · 查看公告栏</li>
          <li>图书馆 · 领取海报</li>
        </ol>
      </div>
    </div>
  </dialog>

  <dialog class="map-dialog" id="full-map" aria-labelledby="map-title">
    <div class="panel-heading">
      <h2 id="map-title">校园全图</h2>
      <button class="close-button" id="map-close" type="button" aria-label="关闭校园全图">×</button>
    </div>
    <canvas id="map-canvas" width="960" height="564" aria-label="包含学校各片区、道路和演示路线的校园地图"></canvas>
    <div class="map-footer"><span>↑ 北 · 中关村校区 · 手绘图重建</span><span>东门 → 广场 → 图书馆</span></div>
  </dialog>
</body>
</html>
